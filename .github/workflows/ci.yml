name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run, so a busy branch
# does not queue up builds nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      # Every version is reported even when one fails, so a Node-specific
      # break is distinguishable from a genuine code break.
      fail-fast: false
      matrix:
        # 20 is the floor the project supports; 22 is current LTS.
        node: [20, 22]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # Keyed on package-lock.json, so the cache is reused until a
          # dependency actually changes.
          cache: npm

      # The Firebase emulators are JVMs, so the rules gate needs a JDK. 21 is
      # what the Firestore emulator requires.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # `npm ci` installs exactly what the lockfile pins and fails if
      # package.json and the lockfile have drifted apart.
      - name: Install dependencies
        run: npm ci

      # Each gate runs as its own step so a red run names what broke rather
      # than pointing at one long "build" log.
      - name: Typecheck
        run: npm run typecheck

      # The domain layer is compiled a second time against a config with no DOM
      # and no path aliases. That is the whole portability guarantee - it is
      # what proves the shared layer could be lifted into a React Native or
      # server build - and it passes or fails independently of the app build.
      - name: Typecheck domain
        run: npm run typecheck:domain

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      # Same tests, node environment, no jsdom. A domain module that reaches
      # for `window` passes the main suite and fails here.
      - name: Test domain
        run: npm run test:domain

      - name: Build
        run: npm run build

      # Weighs what a first-time visitor downloads. Runs after the build
      # because the build is the thing being measured - the chunking strategy
      # has silently reverted before while the source still read as lazy.
      - name: Bundle budget
        run: npm run test:bundle

      # The security rules, run against Firebase's own evaluator rather than
      # compared to the domain as a document. This is the only gate that can
      # tell us the rules will behave on deploy day the way they read here.
      - name: Security rules (emulator)
        run: npm run test:rules

      - name: Upload coverage report
        # Runs even when a gate above failed - the coverage of a failing
        # build is often what explains it.
        if: always() && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Upload production build
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
