<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Declared explicitly so the browser does not fall back to requesting
      /favicon.ico. The 759 kB .ico that used to sit there was downloaded on
      every first visit despite never being referenced anywhere.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Installability. iOS ignores the manifest's icons and reads this link
      instead, so the PNG is not redundant with the entries in the manifest.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BRT" />

    <!-- Open the Firebase Auth connection while the bundle is still parsing. -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />

    <title>BRT Bus Service</title>

    <meta
      name="description"
      content="Plan a journey, check official BRTS fares, browse every route and track buses live on the Raipur to Naya Raipur corridor."
    />
    <meta name="theme-color" content="#B83E2E" />
    <link rel="canonical" href="https://bus-service-lyart.vercel.app/" />

    <!--
      Social scrapers do not run JavaScript, so these are the only metadata a
      shared link ever sees. The per-route equivalents set by
      RouteChangeHandler reach Googlebot, which renders, but never reach
      Facebook, X or WhatsApp.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BRT Bus Service" />
    <meta property="og:title" content="BRT Bus Service - Raipur to Naya Raipur transit" />
    <meta
      property="og:description"
      content="Plan a journey, check official BRTS fares, browse every route and track buses live on the Raipur to Naya Raipur corridor."
    />
    <meta property="og:url" content="https://bus-service-lyart.vercel.app/" />
    <meta property="og:locale" content="en_IN" />
    <meta
      property="og:image"
      content="https://bus-service-lyart.vercel.app/social-preview.webp"
    />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="572" />
    <meta
      property="og:image:alt"
      content="A BRT bus on the Raipur to Naya Raipur corridor"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BRT Bus Service - Raipur to Naya Raipur transit" />
    <meta
      name="twitter:description"
      content="Plan a journey, check official BRTS fares, browse every route and track buses live on the Raipur to Naya Raipur corridor."
    />
    <meta
      name="twitter:image"
      content="https://bus-service-lyart.vercel.app/social-preview.webp"
    />
    <meta
      name="twitter:image:alt"
      content="A BRT bus on the Raipur to Naya Raipur corridor"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
